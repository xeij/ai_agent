name: Keep Alive Secondary

on:
  schedule:
    # Run every 22 minutes (offset from primary)
    - cron: '*/22 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Service
        run: |
          curl -f https://ai-agent-ydbu.onrender.com/ || echo "Secondary ping failed"
          echo "Secondary pinged at $(date)"
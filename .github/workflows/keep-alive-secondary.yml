name: Keep Alive Secondary

on:
  schedule:
    # Run every 30 minutes at minute 15 and 45 (alternating with primary)
    - cron: '15,45 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Service
        run: |
          curl -f https://ai-agent-ydbu.onrender.com/ || echo "Secondary ping failed"
          echo "Secondary pinged at $(date)"
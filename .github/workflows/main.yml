name: Keep Service Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Service
        run: |
          curl -f https://ai-agent-ydbu.onrender.com/ || echo "Service might be down"
          echo "Pinged at $(date)"
